<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>SIROP</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f14; color: #d7e3f0;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #111822; }
  h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; }
  #status { font-size: .85rem; color: #e5534b; }
  #status.on { color: #3fb950; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: ui-monospace, monospace; font-size: .95rem; }
  .me { color: #58a6ff; } .bot { color: #3fb950; } .sys { color: #8b949e; }
  #quick { display: flex; gap: 6px; padding: 6px 16px; overflow-x: auto; }
  #quick button { flex: none; padding: 6px 12px; border-radius: 14px; border: 1px solid #30363d; background: #161b22; color: #d7e3f0; }
  form { display: flex; gap: 8px; padding: 10px 16px 16px; background: #111822; }
  input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0b0f14; color: inherit; font-size: 1rem; }
  button { font-size: 1rem; }
  #send, #mic, #conn { border: 0; border-radius: 8px; padding: 12px 16px; color: #fff; background: #238636; }
  #mic { background: #8957e5; } #mic.rec { background: #e5534b; }
  #conn { background: #1f6feb; padding: 6px 12px; }
</style>
</head>
<body>
<header>
  <h1>SIROP</h1>
  <span id="status">déconnecté</span>
  <button id="conn" type="button">Connecter</button>
</header>
<div id="log"></div>
<div id="quick"></div>
<form id="form">
  <button id="mic" type="button">🎤</button>
  <input id="text" autocomplete="off" placeholder="Commande (discret)…">
  <button id="send" type="submit">➤</button>
</form>

<script>
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // écriture vers SIROP
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notifications de SIROP

const $ = id => document.getElementById(id);
const logEl = $("log"), statusEl = $("status");
let device, rxChar, buffer = "";
const decoder = new TextDecoder(); // en continu : les accents peuvent etre coupes entre deux paquets BLE

function log(text, cls) {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(on) {
  statusEl.textContent = on ? "connecté" : "déconnecté";
  statusEl.className = on ? "on" : "";
  $("conn").textContent = on ? "Déconnecter" : "Connecter";
}

async function connect() {
  if (device && device.gatt.connected) { device.gatt.disconnect(); return; }
  if (!navigator.bluetooth) { log("Web Bluetooth indisponible (utilise Chrome sur Android, en HTTPS).", "sys"); return; }
  try {
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [NUS] });
    device.addEventListener("gattserverdisconnected", () => { setStatus(false); log("Déconnecté", "sys"); });
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rxChar = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged", e => {
      buffer += decoder.decode(e.target.value, { stream: true });
      let i;
      while ((i = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, i);
        if (line === "Code refuse") localStorage.removeItem("sirop_pin");
        log(line, "bot");
        buffer = buffer.slice(i + 1);
      }
    });
    setStatus(true); log("Connecté à " + device.name, "sys");
    let pin = localStorage.getItem("sirop_pin");
    if (!pin) { pin = prompt("Code SIROP :") || ""; }
    await sendRaw("auth " + pin);
    if (pin) localStorage.setItem("sirop_pin", pin);
  } catch (err) { log("Erreur : " + err.message, "sys"); }
}

async function sendRaw(cmd) {
  const data = new TextEncoder().encode(cmd + "\n");
  for (let i = 0; i < data.length; i += 20) await rxChar.writeValue(data.slice(i, i + 20));
}

async function send(cmd) {
  cmd = cmd.trim();
  if (!cmd) return;
  if (!rxChar || !device.gatt.connected) { log("Pas connecté à SIROP", "sys"); return; }
  log("> " + cmd, "me");
  await sendRaw(cmd);
}

// Commandes rapides
["led on", "led off", "météo", "net", "help"].forEach(c => {
  const b = document.createElement("button");
  b.textContent = c; b.onclick = () => send(c);
  $("quick").appendChild(b);
});

$("conn").onclick = connect;
$("form").onsubmit = e => { e.preventDefault(); send($("text").value); $("text").value = ""; };

// Voix
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $("mic").style.display = "none"; }
else {
  const rec = new SR();
  rec.lang = "fr-CA"; rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript.replace(/[.,!?]/g, ""));
  rec.onend = () => $("mic").classList.remove("rec");
  rec.onerror = e => log("Voix : " + e.error, "sys");
  $("mic").onclick = () => { $("mic").classList.add("rec"); rec.start(); };
}
</script>
</body>
</html>
